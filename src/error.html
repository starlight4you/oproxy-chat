<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oproxy Chat</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #009688;
        --accent-strong: #00796b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f10;
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --line: #1f2937;
          --accent: #26a69a;
          --accent-strong: #4db6ac;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      .card {
        width: min(440px, 100%);
        text-align: center;
      }

      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-size: 34px;
        font-weight: 700;
        background: linear-gradient(145deg, #62d0cd, #2297a6);
        box-shadow: 0 12px 32px rgba(0, 150, 136, 0.24);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 11px 24px;
        background: var(--accent);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }

      button:hover {
        background: var(--accent-strong);
      }

      button:active {
        transform: scale(0.98);
      }

      .hint {
        margin: 24px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }

      a {
        color: var(--accent-strong);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">O</div>
      <h1>无法连接到 Oproxy Chat</h1>
      <p>请检查网络连接，或稍后再试。</p>
      <button id="retry" type="button">重新加载</button>
      <p class="hint">
        如果问题持续，请访问
        <a id="website" href="https://oproxy.world">oproxy.world</a>
      </p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const target = params.get("url") || "https://chat.oproxy.world";

      document.getElementById("retry").addEventListener("click", () => {
        window.location.href = target;
      });
    </script>
  </body>
</html>
